<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PanRoute · route report</title>
<link rel="stylesheet" href="style.css"/>
<style>
  body{overflow-y:auto}
  #rpt{max-width:1080px;margin:0 auto;padding:22px 26px}
  .rback{color:var(--cyan);text-decoration:none;font-size:13px}
  .rtitle{font-size:24px;font-weight:800;margin:10px 0 2px}
  .rtitle i{color:var(--neon)}
  .rmeta{color:var(--dim);font-size:13px;margin-bottom:16px}
  .rchain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;margin:14px 0 22px;
    padding:14px 16px;background:var(--panel);border:1px solid var(--stroke);border-radius:12px}
  .rchain .met{background:#0c1524;border:1px solid var(--stroke);border-radius:7px;padding:3px 9px;font-weight:600}
  .rchain .met.end{border-color:var(--neon)} .rchain .met.start{border-color:var(--amber)}
  .rchain .enz{color:var(--cyan);font-family:ui-monospace,monospace;font-size:12px}
  .rchain .ar{color:var(--dim)}
  h2.sec{font-size:16px;margin:26px 0 12px;border-bottom:1px solid var(--stroke);padding-bottom:7px}
  .rxcard{background:var(--panel);border:1px solid var(--stroke);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .rxhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .rxid{font-family:ui-monospace,monospace;font-size:15px;color:var(--neon);font-weight:700}
  .rxeq{color:var(--ink);font-size:13.5px;margin:8px 0}
  .rxec{color:var(--dim);font-size:12px}
  .dirtable{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px;margin-top:10px}
  .dirtable .k{color:var(--dim)}
  .dirtable .v b{color:var(--ink)}
  .xrefs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .xref{font-size:11.5px;padding:3px 9px;border-radius:16px;border:1px solid var(--stroke);
    background:#0c1524;color:var(--cyan);text-decoration:none}
  .xref:hover{border-color:var(--cyan)}
  .xref .db{color:var(--dim);margin-right:5px;text-transform:uppercase;font-size:10px}
  .dg{font-weight:700}.dg.fav{color:var(--green)}.dg.unfav{color:var(--red)}.dg.rev{color:var(--amber)}
  .splist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
  .spitem{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--stroke);
    border-radius:9px;padding:8px 10px;font-size:13px}
  .spitem i{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pending{color:var(--amber);font-size:13px;background:rgba(255,181,71,.08);border-left:2px solid var(--amber);
    padding:8px 12px;border-radius:6px}
  /* ---- modularised metabolic map ---- */
  .subchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
  .subchip{font-size:11.5px;padding:3px 10px;border-radius:16px;background:rgba(57,192,255,.12);color:var(--cyan);border:1px solid #244}
  .module{border:1px solid var(--stroke);border-radius:14px;margin:14px 0;background:linear-gradient(180deg,rgba(20,30,48,.5),rgba(11,18,32,.5))}
  .modhead{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--stroke);font-weight:700}
  .modhead .mdot{width:11px;height:11px;border-radius:3px}
  .modhead .msub{color:var(--dim);font-weight:400;font-size:12px}
  .modflow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:18px 16px}
  .metnode{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:120px}
  .metnode .struct{background:#fff;border-radius:10px;padding:4px;width:118px;height:98px;display:flex;align-items:center;justify-content:center;border:1px solid #2a3a52}
  .metnode .struct.nostruct{background:#0c1524;color:var(--dim);font-size:10px;text-align:center;padding:8px}
  .metnode .mname{font-size:11.5px;text-align:center;max-width:130px;line-height:1.2;font-weight:600}
  .metnode.endpt .mname{color:var(--neon)} .metnode.startpt .mname{color:var(--amber)}
  .rxstep{display:flex;flex-direction:column;align-items:center;min-width:120px;padding:0 4px}
  .rxstep .rxarrow{width:100%;height:2px;background:linear-gradient(90deg,#2f7bff,#39c0ff);position:relative}
  .rxstep .rxarrow:after{content:"▶";position:absolute;right:-3px;top:-9px;color:#39c0ff;font-size:12px}
  .rxstep .enz{color:var(--cyan);font-family:ui-monospace,monospace;font-size:12px;font-weight:700;margin-bottom:3px}
  .rxstep .rxmeta{font-size:10px;color:var(--dim);margin-top:3px;text-align:center}
  .rxstep .rxmeta a{color:var(--cyan);text-decoration:none}
  .rxstep .dgchip{font-size:10px;padding:1px 6px;border-radius:10px;margin-top:3px}
</style>
</head>
<body>
<div id="rpt">loading…</div>
<script src="https://unpkg.com/smiles-drawer@2.0.3/dist/smiles-drawer.min.js"></script>
<script src="route.js"></script>
</body>
</html>
